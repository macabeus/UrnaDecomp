## Extra OpenSSL Configure target for the vota_web_wasm reproduction (passed with --config=).
## "cc" is the conan-center target for os=Emscripten: BASE_unix, CFLAGS -O, thread_scheme (unknown), no dso_scheme.
## The knobs are read from the environment so one script can build every variant under test:
##   URNA_OSSL_CFLAGS  the target's CFLAGS (default "-O", the "cc" value)
##   URNA_OSSL_CNF_CFLAGS  extra target cflags (lowercase = CNF_CFLAGS, placed BEFORE $(CFLAGS) on the compile line)
##   URNA_OSSL_BN_OPS  bn_ops ("" = THIRTY_TWO_BIT only; "BN_LLONG" = THIRTY_TWO_BIT + BN_LLONG)
my %targets = (
    "urna-wasm" => {
        inherit_from     => [ "cc" ],
        CFLAGS           => $ENV{URNA_OSSL_CFLAGS} // "-O",
        cflags           => add($ENV{URNA_OSSL_CNF_CFLAGS} // ""),
        bn_ops           => $ENV{URNA_OSSL_BN_OPS} // "",
    },
);
